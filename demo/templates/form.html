<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ctrl+C-Ya | Imposter Scanner</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>	

	<main class="background-wrapper">
		<div class="glass-card">
			<header>
				<h1 class="form-title">Ctrl+C-Ya</h1>
			</header>

			<form method="GET" action="/result">
				<div class="input-group">
					<label for="fname">Name:</label><br>
					<input type="text" placeholder="Enter your full name" id="fname" name="fname" required><br>
				</div>

				<div class="input-group">
					<label for="username">Username:</label><br>
					<input type="text" placeholder="Enter your username" id="username" name="username" required><br>
				</div>

				<div class="input-group textarea-group">
					<label for="description">Bio Descriptions:</label><br>
					<textarea name="description" placeholder="(Optional)" id="description"></textarea><br><br>
				</div>

				<button type="submit" class="submit-btn">Submit</button>
				


			</form>
		</div>
	</main>
 
	<footer style="position: fixed; bottom: 20px; left:20px; color:white; opacity:0.8;">
		<small>&copy; Phuong-Anh Pham, 2026</small>
		
	</footer>
</body>
</html>
